
workflows:
  ios-testflight:
    name: Turtle Dove - iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.turtledove

      groups:
        - turtle

      vars:
        BUNDLE_ID: com.mndrs.turtledove

    scripts:
      - name: Disable Swift Package Manager
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager

      - name: Validate app configuration and create .env
        script: |
          set -euo pipefail

          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found."
            exit 1
          }

          : "${SUPABASE_URL:?Add SUPABASE_URL to the turtle variable group}"
          : "${SUPABASE_ANON_KEY:?Add SUPABASE_ANON_KEY to the turtle variable group}"

          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          MEDIASOUP_SIGNALING_URL=${MEDIASOUP_SIGNALING_URL:-}
          TURN_URL=${TURN_URL:-}
          TURN_USERNAME=${TURN_USERNAME:-}
          TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
          EOF

          echo "Build environment configured."

      - name: Restore and validate Firebase iOS configuration
        script: |
          set -euo pipefail

          : "${GOOGLE_SERVICE_INFO_PLIST_BASE64:?Add GOOGLE_SERVICE_INFO_PLIST_BASE64 to the turtle variable group}"

          mkdir -p ios/Runner

          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" \
            | base64 -D > ios/Runner/GoogleService-Info.plist

          test -s ios/Runner/GoogleService-Info.plist || {
            echo "ERROR: Firebase plist is empty."
            exit 1
          }

          PLIST_BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :BUNDLE_ID' \
              ios/Runner/GoogleService-Info.plist
          )

          if [ "$PLIST_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Firebase bundle ID mismatch: $PLIST_BUNDLE_ID"
            exit 1
          fi

          grep -Fq 'com.mndrs.turtledove' lib/firebase_options.dart || {
            echo "ERROR: firebase_options.dart has the wrong iOS configuration."
            exit 1
          }

          echo "Firebase configuration validated."

      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          flutter pub get

      - name: Verify iOS bundle identifier
        script: |
          set -euo pipefail

          grep -Fq \
            'PRODUCT_BUNDLE_IDENTIFIER = com.mndrs.turtledove;' \
            ios/Runner.xcodeproj/project.pbxproj || {
              echo "ERROR: Runner bundle identifier is incorrect."
              exit 1
            }

          echo "Bundle identifier validated."

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail

          cd ios
          export COCOAPODS_DISABLE_STATS=true

          for i in 1 2 3 4 5; do
            echo "CocoaPods attempt $i/5"

            if pod install --repo-update; then
              echo "CocoaPods installation succeeded."
              exit 0
            fi

            if [ "$i" -lt 5 ]; then
              sleep 15
            fi
          done

          echo "ERROR: CocoaPods installation failed after 5 attempts."
          exit 1

      - name: Configure iOS code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Calculate iOS build number
        script: |
          set -euo pipefail

          APPLE_PREVIOUS_BUILD=1791911619
          CM_NUMBER="${CM_BUILD_NUMBER:-1}"

          if ! [[ "$CM_NUMBER" =~ ^[0-9]+$ ]] || [ "$CM_NUMBER" -lt 1 ]; then
            echo "ERROR: Invalid Codemagic build number: $CM_NUMBER"
            exit 1
          fi

          IOS_CF_BUNDLE_VERSION=$((APPLE_PREVIOUS_BUILD + CM_NUMBER))

          echo "Bundle ID: $BUNDLE_ID"
          echo "Previous Apple build: $APPLE_PREVIOUS_BUILD"
          echo "Codemagic build number: $CM_NUMBER"
          echo "FINAL iOS CFBundleVersion: $IOS_CF_BUNDLE_VERSION"

          echo "IOS_CF_BUNDLE_VERSION=$IOS_CF_BUNDLE_VERSION" >> "$CM_ENV"

      - name: Build signed IPA for TestFlight
        script: |
          set -euo pipefail
          
          : "${IOS_CF_BUNDLE_VERSION:?IOS_CF_BUNDLE_VERSION is missing}"
          
          echo "Building with CFBundleVersion=$IOS_CF_BUNDLE_VERSION"
          
          flutter build ipa \
            --release \
            --build-number="$IOS_CF_BUNDLE_VERSION" \
            --export-options-plist="$EXPORT_OPTIONS"
          
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA file not found"
            exit 1
          fi
          
          INFO_PLIST_ENTRY="$(unzip -Z1 "$IPA_PATH" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -n 1)"
          
          if [ -z "$INFO_PLIST_ENTRY" ]; then
            echo "ERROR: Info.plist not found inside IPA"
            exit 1
          fi
          
          TEMP_INFO_PLIST="$(mktemp)"
          trap 'rm -f "$TEMP_INFO_PLIST"' EXIT
          
          unzip -p "$IPA_PATH" "$INFO_PLIST_ENTRY" > "$TEMP_INFO_PLIST"
          
          ACTUAL_BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$TEMP_INFO_PLIST")
          
          echo "Expected CFBundleVersion: $IOS_CF_BUNDLE_VERSION"
          echo "Actual IPA CFBundleVersion: $ACTUAL_BUNDLE_VERSION"
          
          if [ "$ACTUAL_BUNDLE_VERSION" != "$IOS_CF_BUNDLE_VERSION" ]; then
            echo "ERROR: IPA build number mismatch!"
            exit 1
          fi
          
          if [ "$ACTUAL_BUNDLE_VERSION" -le "$APPLE_PREVIOUS_BUILD" ]; then
            echo "ERROR: IPA build number is not higher than Apple's previous build!"
            exit 1
          fi
          
          echo "SUCCESS: IPA contains the correct CFBundleVersion."

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/**/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        # beta_groups:
        #   - group_name_here
