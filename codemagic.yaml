workflows:
  ios-testflight:
    name: Turtle Dove - iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    # This integration must exist in Codemagic Team settings > Integrations.
    # Reuses the App Store Connect integration previously used in your setup.
    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      # TestFlight/App Store distribution signing. Codemagic fetches matching
      # signing files for this bundle ID using the App Store Connect integration.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.turtledove

      groups:
        - turtle

      vars:
        BUNDLE_ID: com.mndrs.turtledove

    scripts:
      - name: Validate app configuration and create .env
        script: |
          set -euo pipefail

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found. Ensure codemagic.yaml is in the Flutter project root."
            exit 1
          fi

          : "${SUPABASE_URL:?Add SUPABASE_URL to the turtle_dove_env Codemagic variable group}"
          : "${SUPABASE_ANON_KEY:?Add SUPABASE_ANON_KEY to the turtle_dove_env Codemagic variable group}"

          # pubspec.yaml declares .env as a Flutter asset, but secrets should not
          # be committed to Git. Re-create it on the build machine.
          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          MEDIASOUP_SIGNALING_URL=${MEDIASOUP_SIGNALING_URL:-}
          TURN_URL=${TURN_URL:-}
          TURN_USERNAME=${TURN_USERNAME:-}
          TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
          EOF

          echo "Created build-time .env (secret values are not printed)."

      - name: Restore and validate Firebase iOS configuration
        script: |
          set -euo pipefail

          : "${GOOGLE_SERVICE_INFO_PLIST_BASE64:?Add GOOGLE_SERVICE_INFO_PLIST_BASE64 to the turtle_dove_firebase Codemagic variable group}"

          mkdir -p ios/Runner
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -D > ios/Runner/GoogleService-Info.plist

          if [ ! -s ios/Runner/GoogleService-Info.plist ]; then
            echo "ERROR: GoogleService-Info.plist was not restored correctly."
            exit 1
          fi

          PLIST_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist)
          if [ "$PLIST_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Firebase plist bundle ID is '$PLIST_BUNDLE_ID'; expected '$BUNDLE_ID'."
            exit 1
          fi

          # Firebase.initializeApp uses lib/firebase_options.dart as well as the
          # native plist. Stop rather than silently shipping stale Firebase options.
          if ! grep -Fq 'com.mndrs.turtledove' lib/firebase_options.dart; then
            echo "ERROR: lib/firebase_options.dart does not contain com.mndrs.turtledove."
            echo "Register the iOS app in Firebase with this Bundle ID, run FlutterFire configure, and commit the updated file."
            exit 1
          fi

          echo "Firebase iOS bundle ID matches $BUNDLE_ID."

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Verify iOS bundle identifier
        script: |
          set -euo pipefail
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.mndrs.turtledove;' ios/Runner.xcodeproj/project.pbxproj || {
            echo "ERROR: Runner bundle identifier is not com.mndrs.turtledove."
            exit 1
          }

      - name: Configure iOS code signing
        script: xcode-project use-profiles

      - name: Build signed IPA for TestFlight
        script: |
          set -euo pipefail

          BUILD_NUMBER="${CM_BUILD_NUMBER:-1}"

          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/**/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
