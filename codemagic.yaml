
workflows:
  ios-testflight:
    name: Turtle Dove - iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mndrs.turtledove

      groups:
        - turtle

      vars:
        BUNDLE_ID: com.mndrs.turtledove

    scripts:
      - name: Disable Swift Package Manager
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager

      - name: Validate app configuration and create .env
        script: |
          set -euo pipefail

          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found."
            exit 1
          }

          : "${SUPABASE_URL:?Add SUPABASE_URL to the turtle variable group}"
          : "${SUPABASE_ANON_KEY:?Add SUPABASE_ANON_KEY to the turtle variable group}"

          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          MEDIASOUP_SIGNALING_URL=${MEDIASOUP_SIGNALING_URL:-}
          TURN_URL=${TURN_URL:-}
          TURN_USERNAME=${TURN_USERNAME:-}
          TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
          EOF

          echo "Build environment configured."

      - name: Restore and validate Firebase iOS configuration
        script: |
          set -euo pipefail

          : "${GOOGLE_SERVICE_INFO_PLIST_BASE64:?Add GOOGLE_SERVICE_INFO_PLIST_BASE64 to the turtle variable group}"

          mkdir -p ios/Runner

          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" \
            | base64 -D > ios/Runner/GoogleService-Info.plist

          test -s ios/Runner/GoogleService-Info.plist || {
            echo "ERROR: Firebase plist is empty."
            exit 1
          }

          PLIST_BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :BUNDLE_ID' \
              ios/Runner/GoogleService-Info.plist
          )

          if [ "$PLIST_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Firebase bundle ID mismatch: $PLIST_BUNDLE_ID"
            exit 1
          fi

          grep -Fq 'com.mndrs.turtledove' lib/firebase_options.dart || {
            echo "ERROR: firebase_options.dart has the wrong iOS configuration."
            exit 1
          }

          echo "Firebase configuration validated."

      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          flutter pub get

      - name: Verify iOS bundle identifier
        script: |
          set -euo pipefail

          grep -Fq \
            'PRODUCT_BUNDLE_IDENTIFIER = com.mndrs.turtledove;' \
            ios/Runner.xcodeproj/project.pbxproj || {
              echo "ERROR: Runner bundle identifier is incorrect."
              exit 1
            }

          echo "Bundle identifier validated."

      - name: Install CocoaPods dependencies
        script: |
          set -euo pipefail

          cd ios
          export COCOAPODS_DISABLE_STATS=true

          for i in 1 2 3 4 5; do
            echo "CocoaPods attempt $i/5"

            if pod install --repo-update; then
              echo "CocoaPods installation succeeded."
              exit 0
            fi

            if [ "$i" -lt 5 ]; then
              sleep 15
            fi
          done

          echo "ERROR: CocoaPods installation failed after 5 attempts."
          exit 1

      - name: Configure iOS code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Calculate iOS build number
        script: |
          set -euo pipefail

          BUILD_NUMBER="${CM_BUILD_NUMBER:-9}"

          echo "Bundle ID: $BUNDLE_ID"
          echo "Build number: $BUILD_NUMBER"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      - name: Build signed IPA for TestFlight
        script: |
          set -euo pipefail

          EXPORT_OPTIONS="/Users/builder/export_options.plist"

          if [ ! -s "$EXPORT_OPTIONS" ]; then
            echo "ERROR: Codemagic export options plist is missing."
            exit 1
          fi

          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$EXPORT_OPTIONS"

          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file was generated."
            exit 1
          fi

          echo "IPA generated successfully: $IPA_PATH"

          # Verify the APNs entitlement in the signed IPA.
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT

          /usr/bin/unzip -q "$IPA_PATH" -d "$VERIFY_DIR"

          APP_PATH="$(find "$VERIFY_DIR/Payload" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found inside the IPA."
            exit 1
          fi

          ENTITLEMENTS_PATH="$VERIFY_DIR/signed-entitlements.plist"

          if ! /usr/bin/codesign \
            -d --entitlements :- "$APP_PATH" \
            > "$ENTITLEMENTS_PATH" 2>/dev/null; then
            echo "ERROR: Could not read signed IPA entitlements."
            exit 1
          fi

          if [ ! -s "$ENTITLEMENTS_PATH" ]; then
            echo "ERROR: Signed entitlements are empty."
            exit 1
          fi

          APNS_ENVIRONMENT=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :aps-environment' \
              "$ENTITLEMENTS_PATH" 2>/dev/null || true
          )

          if [ "$APNS_ENVIRONMENT" != "production" ]; then
            echo "ERROR: Expected aps-environment=production."
            echo "Actual aps-environment: ${APNS_ENVIRONMENT:-MISSING}"
            exit 1
          fi

          echo "Verified signed IPA aps-environment: production"

          SIGNED_BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              "$APP_PATH/Info.plist"
          )

          if [ "$SIGNED_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: Signed IPA bundle ID mismatch: $SIGNED_BUNDLE_ID"
            exit 1
          fi

          echo "Verified signed IPA bundle ID: $SIGNED_BUNDLE_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/**/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
