name: kpss_mobile_app
description: KPSS Adaylarına Yönelik Production-Ready Mobil Uygulama

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ============================================================================
  # CORE & STATE MANAGEMENT
  # ============================================================================
  
  provider: ^6.0.0
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # ============================================================================
  # BACKEND & DATABASE
  # ============================================================================
  
  supabase_flutter: ^1.10.0
  supabase: ^1.10.0
  realtime_client: ^0.4.0
  
  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  
  flutter_appauth: ^6.0.0
  shared_preferences: ^2.1.0
  secure_storage: ^1.0.0
  
  # ============================================================================
  # AUDIO & TTS
  # ============================================================================
  
  flutter_tts: ^1.0.0
  audio_session: ^0.1.0
  just_audio: ^0.9.0
  
  # ============================================================================
  # NOTIFICATIONS (FCM)
  # ============================================================================
  
  firebase_core: ^2.21.0
  firebase_messaging: ^14.6.0
  
  # ============================================================================
  # UI & DESIGN
  # ============================================================================
  
  flutter_staggered_animations: ^1.1.0
  shimmer: ^3.0.0
  loading_animation_widget: ^1.2.0
  awesome_dialog: ^3.1.0
  percent_indicator: ^4.1.0
  charts_flutter: ^0.12.0
  fl_chart: ^0.62.0
  
  # ============================================================================
  # NAVIGATION & ROUTING
  # ============================================================================
  
  go_router: ^10.0.0
  
  # ============================================================================
  # UTILITIES
  # ============================================================================
  
  uuid: ^4.0.0
  intl: ^0.19.0
  crypto: ^3.0.3
  logger: ^2.0.0
  dio: ^5.3.0
  connectivity_plus: ^5.0.0
  package_info_plus: ^4.1.0
  
  # ============================================================================
  # JSON & SERIALIZATION
  # ============================================================================
  
  json_annotation: ^4.8.0
  
  # ============================================================================
  # IMAGE & MEDIA
  # ============================================================================
  
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  image_cropper: ^5.0.0
  photo_view: ^0.14.0
  
  # ============================================================================
  # PERSISTENCE & CACHING
  # ============================================================================
  
  sqflite: ^2.3.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # ============================================================================
  # ANALYTICS & DEBUGGING
  # ============================================================================
  
  firebase_analytics: ^10.7.0
  sentry_flutter: ^7.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  
  # ============================================================================
  # TESTING
  # ============================================================================
  
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
